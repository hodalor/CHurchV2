services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: churchflow_master
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 5100
      MONGODB_URI: mongodb://mongo:27017
      MASTER_DB_NAME: churchflow_master
      JWT_SECRET: change-me-for-local-dev
      REFRESH_TOKEN_SECRET: change-me-for-local-dev-refresh
      FRONTEND_URL: http://localhost:3000
    ports:
      - "5100:5100"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5100/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mongo-data:
